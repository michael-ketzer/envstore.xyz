name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the GitHub release

env:
  # Same stubs as CI — the build step doesn't connect anywhere.
  DATABASE_URL: "postgresql://stub:stub@stub.example.com:5432/stub?sslmode=verify-full"
  DIRECT_URL: "postgresql://stub:stub@stub.example.com:5432/stub?sslmode=verify-full"
  AUTH_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  NEXT_PUBLIC_APP_URL: "https://envstore.xyz"
  PADDLE_ENV: "production"

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: envstore-darwin-arm64
          - target: bun-darwin-x64
            artifact: envstore-darwin-x64
          - target: bun-linux-arm64
            artifact: envstore-linux-arm64
          - target: bun-linux-x64
            artifact: envstore-linux-x64
    steps:
      - uses: actions/checkout@v6

      # Don't pass `version` — pnpm/action-setup reads `packageManager` from
      # package.json. Passing both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Build ${{ matrix.target }}
        working-directory: apps/cli
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile bin/${{ matrix.artifact }} \
            --minify

      - name: Smoke-test (linux-x64 only — others can't run on the runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          apps/cli/bin/${{ matrix.artifact }} --version
          apps/cli/bin/${{ matrix.artifact }} help | head -5

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/cli/bin/${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release directory
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            cp "artifacts/envstore-$target/envstore-$target" "release/envstore-$target"
            chmod +x "release/envstore-$target"
            # SHA-256 alongside each binary — clients (incl. /install) can verify.
            (cd release && sha256sum "envstore-$target" > "envstore-$target.sha256")
          done
          # Ship the third-party attribution alongside the binaries. BSD 3-Clause
          # and similar licenses require this notice to travel with binary
          # distributions.
          cp LICENSE release/LICENSE
          cp THIRD_PARTY_LICENSES.md release/THIRD_PARTY_LICENSES.md
          ls -la release/

      # Cryptographic signature for every binary. Defends against a compromised
      # GitHub release publisher — the .sha256 sidecar can be regenerated if
      # the binary is swapped, but the .minisig can't be without the offline
      # private key. The MINISIGN_PRIVATE_KEY secret should be a no-password
      # minisign secret-key file (generate locally with `minisign -W -G`); the
      # matching public key lives in the deployed installer + a committed
      # RELEASE_SIGNING.pub for transparency.
      #
      # Skipped (with a loud log) if the secret isn't configured yet, so this
      # workflow keeps producing releases during the initial rollout. The
      # installer side enforces "require signature" only when its pinned
      # RELEASE_SIGNING_PUBKEY is set, so the two roll forward in lockstep.
      - name: Sign release binaries with minisign
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_PRIVATE_KEY:-}" ]; then
            echo "::warning::MINISIGN_PRIVATE_KEY is not configured — release will ship UNSIGNED."
            echo "::warning::See apps/web/src/app/install/route.ts header for setup instructions."
            exit 0
          fi
          sudo apt-get update >/dev/null
          sudo apt-get install -y minisign >/dev/null
          # Stage the key in a temp file with mode 600 so the secret never
          # lands in shell history or a process arg list. Wipe on exit.
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$KEYFILE"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            # -W: the key has no password (it's already protected by GH secrets).
            # -t: trusted comment travels with the signature.
            ( cd release && \
              minisign -S -W -s "$KEYFILE" \
                -m "envstore-$target" \
                -x "envstore-$target.minisig" \
                -t "envstore ${{ github.ref_name }} envstore-$target" )
          done
          ls -la release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
