name: post-release smoke

# Fires automatically when release.yml publishes a GitHub release. Downloads
# the freshly-built binary on each supported platform and asserts:
#   1. `--version` matches the release tag (catches "wrong version baked in").
#   2. The .sha256 sidecar matches the binary we downloaded (catches a
#      corrupted upload).
#   3. If RELEASE_SIGNING_PUBKEY is configured, the .minisig signature
#      verifies against the pinned public key (catches a tampered release
#      or a wrong key in CI).
#   4. `help` returns 0 and prints something sensible (catches a binary that
#      compiles but can't even open its own help text).
#
# This deliberately does NOT touch a live API. A staging end-to-end test
# belongs in a separate workflow once a staging deployment exists.

on:
  release:
    types: [published]

jobs:
  smoke:
    name: Smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: envstore-linux-x64
          - runner: macos-14
            target: envstore-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Resolve release tag
        id: tag
        # github.event.release.tag_name on `release` events; trim the leading
        # `v` so other steps can use the bare version when needed.
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download binary + sha256 + (optional) minisig sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.target }}" \
            --pattern "${{ matrix.target }}.sha256" \
            --pattern "${{ matrix.target }}.minisig" || true
          ls -la "${{ matrix.target }}" "${{ matrix.target }}.sha256"
          # minisig is optional during rollout — release.yml only emits it once
          # MINISIGN_PRIVATE_KEY is configured. Don't fail this step if absent.
          ls -la "${{ matrix.target }}.minisig" 2>/dev/null || echo "no .minisig sidecar (signing not yet enabled)"

      - name: Verify sha256 sidecar
        # macOS doesn't ship sha256sum by default — use shasum -a 256 on Darwin.
        # Both formats are "<hash>  <filename>", `-c` validates against the file.
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${{ matrix.target }}.sha256"
          else
            shasum -a 256 -c "${{ matrix.target }}.sha256"
          fi

      - name: Verify minisign signature
        # Hard fail if RELEASE_SIGNING_PUBKEY is configured (we expect every
        # release to ship a valid .minisig) but soft-skip if not (initial
        # rollout / pre-key world). The actual installer enforces the same
        # invariant via the pinned PUBKEY env var.
        env:
          RELEASE_SIGNING_PUBKEY: ${{ vars.RELEASE_SIGNING_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_PUBKEY:-}" ]; then
            echo "::notice::RELEASE_SIGNING_PUBKEY not configured — skipping signature verification."
            exit 0
          fi
          if [ ! -f "${{ matrix.target }}.minisig" ]; then
            echo "::error::Pubkey is configured but ${{ matrix.target }}.minisig is missing from this release. Did the signing step in release.yml run?"
            exit 1
          fi
          # Install minisign on the smoke runner. Linux: apt. macOS: homebrew.
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update >/dev/null
            sudo apt-get install -y minisign >/dev/null
          else
            brew install minisign >/dev/null
          fi
          minisign -V -P "$RELEASE_SIGNING_PUBKEY" \
            -m "${{ matrix.target }}" \
            -x "${{ matrix.target }}.minisig"

      - name: Make executable
        run: chmod +x "${{ matrix.target }}"

      - name: --version matches the release tag
        run: |
          set -euo pipefail
          actual="$(./${{ matrix.target }} --version)"
          expected="${{ steps.tag.outputs.version }}"
          echo "binary reports: ${actual}"
          echo "release tag:    ${expected}"
          [ "${actual}" = "${expected}" ] || {
            echo "Version mismatch — the binary in this release was built against the wrong version." >&2
            exit 1
          }

      - name: help exits 0 and prints something
        run: |
          set -euo pipefail
          out="$(./${{ matrix.target }} help)"
          [ -n "$out" ] || { echo "help printed nothing" >&2; exit 1; }
          echo "$out" | head -3
