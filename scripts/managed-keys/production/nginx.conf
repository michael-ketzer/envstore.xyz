limit_req_zone $binary_remote_addr zone=envstore_bao:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bao.envstore.xyz;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/envstore-acme; }
    location / { return 308 https://bao.envstore.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bao.envstore.xyz;
    ssl_certificate /etc/letsencrypt/live/bao.envstore.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bao.envstore.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:envstore_bao_tls:10m;
    ssl_session_tickets off;
    client_max_body_size 32k;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    limit_req zone=envstore_bao burst=40 nodelay;
    limit_req_status 429;

    # Remote envstore is allowed only its required Transit operations.
    # Bootstrap, auth management, snapshots, seals and UI stay SSH/local-only.
    location ~ "^/v1/transit/(?:keys/envstore-[0-9a-f-]{36}(?:/rotate)?|datakey/plaintext/envstore-[0-9a-f-]{36}|decrypt/envstore-[0-9a-f-]{36})$" {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / { return 404; }
}
