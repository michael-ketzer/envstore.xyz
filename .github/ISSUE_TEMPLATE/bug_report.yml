name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing! Before submitting, please:

        - **Security issue?** Email security@envstore.xyz instead, see [SECURITY.md](../../blob/main/SECURITY.md).
        - **Check existing issues** to avoid duplicates.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, factual description.
      placeholder: When I run `envstore push .env`, the CLI hangs after "Uploading…" and never finishes.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The push to complete and print a "Pushed v1" success line.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered steps. Smaller is better.
      placeholder: |
        1. `envstore init`
        2. `envstore push .env`
        3. Hangs
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: CLI version
      description: Output of `envstore --version`
      placeholder: 0.1.0
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, pnpm version
      placeholder: macOS 14.5, Node 24.x, pnpm 11.0.9
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (redact secrets)
      description: |
        For CLI issues, paste output. For web issues, paste any browser console errors and the network request that failed.
      render: shell
    validations:
      required: false
