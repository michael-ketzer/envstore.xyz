name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the GitHub release

env:
  # Same stubs as CI — the build step doesn't connect anywhere.
  DATABASE_URL: "postgresql://stub:stub@stub.example.com:5432/stub?sslmode=require"
  DIRECT_URL: "postgresql://stub:stub@stub.example.com:5432/stub?sslmode=require"
  AUTH_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  NEXT_PUBLIC_APP_URL: "https://envstore.xyz"
  PADDLE_ENV: "production"

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: envstore-darwin-arm64
          - target: bun-darwin-x64
            artifact: envstore-darwin-x64
          - target: bun-linux-arm64
            artifact: envstore-linux-arm64
          - target: bun-linux-x64
            artifact: envstore-linux-x64
    steps:
      - uses: actions/checkout@v6

      # Don't pass `version` — pnpm/action-setup reads `packageManager` from
      # package.json. Passing both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Build ${{ matrix.target }}
        working-directory: apps/cli
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile bin/${{ matrix.artifact }} \
            --minify

      - name: Smoke-test (linux-x64 only — others can't run on the runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          apps/cli/bin/${{ matrix.artifact }} --version
          apps/cli/bin/${{ matrix.artifact }} help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/cli/bin/${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release directory
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            cp "artifacts/envstore-$target/envstore-$target" "release/envstore-$target"
            chmod +x "release/envstore-$target"
            # SHA-256 alongside each binary — clients (incl. /install) can verify.
            (cd release && sha256sum "envstore-$target" > "envstore-$target.sha256")
          done
          ls -la release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
